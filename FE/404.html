<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrepMate — Không tìm thấy trang (404)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./shared/css/tokens.css?v=29">
    <link rel="stylesheet" href="./shared/css/base.css?v=29">
    <link rel="stylesheet" href="./shared/css/layout.css?v=29">
    <link rel="stylesheet" href="./shared/css/components.css?v=29">
    <link rel="stylesheet" href="./404.css?v=29">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('prepmate_theme');
                if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <main class="standalone-404-container">
        <div class="standalone-404-card">
            <!-- Subtle Brand Mark -->
            <a href="index.html" class="standalone-brand" aria-label="PrepMate Trang chủ">
                <span class="brand-text">Prep<span class="brand-accent">Mate</span></span>
            </a>

            <!-- Standalone SVG Error Illustration (WI-PROGRESS-404-PRESENTATION-FIX-01) -->
            <div class="error-illustration" aria-hidden="true">
                <div class="illustration-bubble">
                    <svg class="error-svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        <line x1="8" y1="11" x2="14" y2="11"/>
                    </svg>
                </div>
            </div>

            <!-- Unified 404 Typography Group -->
            <div class="error-code" aria-label="Mã lỗi 404">404</div>

            <!-- Clear & Friendly Message -->
            <h1 class="error-title pm-page-title">Không tìm thấy trang bạn cần</h1>
            <p class="error-desc pm-page-subtitle">Trang này có thể đã được di chuyển, thay đổi địa chỉ hoặc không còn tồn tại.</p>

            <!-- Focused Recovery Actions -->
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Về trang chủ</span>
                </a>
                <button type="button" class="btn btn-ghost" onclick="if(window.history.length>1){window.history.back()}else{window.location.href='index.html'}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    <span>Quay lại trang trước</span>
                </button>
            </div>
        </div>
    </main>

    <script src="./shared/js/main.js?v=29"></script>
</body>

</html>
