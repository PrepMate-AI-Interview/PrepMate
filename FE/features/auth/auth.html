<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepMate - Đăng nhập & Đăng ký</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Canonical Design Tokens & System Stylesheets -->
    <link rel="stylesheet" href="../../shared/css/tokens.css?v=26" />
    <link rel="stylesheet" href="../../shared/css/base.css?v=26" />
    <link rel="stylesheet" href="../../shared/css/layout.css?v=26" />
    <link rel="stylesheet" href="../../shared/css/components.css?v=26" />
    <link rel="stylesheet" href="../../shared/css/style.css?v=18" />
    <link rel="stylesheet" href="./auth.css?v=21" />
  </head>

  <body class="auth-body">
    <!-- Top Navigation Bar -->
    <div class="auth-top-bar">
      <a href="../../index.html" class="auth-nav-home" title="Về trang chủ PrepMate">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Trang chủ</span>
      </a>

      <button
        type="button"
        class="auth-theme-toggle"
        id="auth-theme-toggle"
        aria-label="Chuyển đổi giao diện Sáng / Tối"
        title="Chuyển đổi giao diện Sáng / Tối"
        onclick="toggleGlobalTheme(event)"
      >
        <span class="auth-theme-icon-dark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="auth-theme-icon-light" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
      </button>
    </div>

    <!-- Main Authentication Shell -->
    <main class="auth-container">
      <section class="auth-card" aria-label="Xác thực tài khoản PrepMate">
        <!-- Brand Header -->
        <header class="auth-header">
          <a href="../../index.html" class="auth-brand-logo" aria-label="PrepMate - Về trang chủ">
            Prep<span class="auth-brand-accent">Mate</span>
          </a>
          <h1 class="auth-title" id="form-title">Đăng nhập</h1>
          <p class="auth-subtitle" id="form-subtitle">Tiếp tục hành trình luyện phỏng vấn của bạn</p>
        </header>

        <!-- Segmented Tab Switcher -->
        <div class="auth-tabs" role="tablist" aria-label="Chuyển chế độ xác thực">
          <button
            type="button"
            class="auth-tab active"
            data-tab="login"
            role="tab"
            aria-selected="true"
            aria-controls="login-form"
            onclick="switchTab('login')"
          >
            Đăng nhập
          </button>
          <button
            type="button"
            class="auth-tab"
            data-tab="signup"
            role="tab"
            aria-selected="false"
            aria-controls="signup-form"
            onclick="switchTab('signup')"
          >
            Đăng ký
          </button>
        </div>

        <!-- ==================================================================
             LOGIN FORM
             ================================================================== -->
        <form id="login-form" class="auth-form active" novalidate>
          <div id="login-error" class="error-message" role="alert"></div>
          <div id="login-success" class="success-message" role="status"></div>

          <div class="form-group">
            <label class="form-label" for="login-email">Email hoặc Tên đăng nhập</label>
            <input
              type="text"
              id="login-email"
              name="identifier"
              class="form-input"
              placeholder="name@example.com hoặc username"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Mật khẩu</label>
            <div class="input-password-wrap">
              <input
                type="password"
                id="login-password"
                name="password"
                class="form-input"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="btn-toggle-password"
                onclick="togglePasswordVisibility('login-password', this)"
                aria-label="Hiện mật khẩu"
                title="Hiện mật khẩu"
              >
                <svg class="auth-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="auth-eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-options-row">
            <label class="auth-checkbox-label" for="login-remember">
              <input type="checkbox" id="login-remember" name="remember" />
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a href="../help/help.html" class="auth-forgot-link" title="Trợ giúp tài khoản & khôi phục mật khẩu">Quên mật khẩu?</a>
          </div>

          <button type="submit" id="login-submit" class="auth-button">
            Đăng nhập
          </button>

          <div class="auth-link">
            Chưa có tài khoản?
            <a href="#" onclick="switchTab('signup'); return false;">Đăng ký tài khoản mới</a>
          </div>
        </form>

        <!-- ==================================================================
             SIGNUP FORM
             ================================================================== -->
        <form id="signup-form" class="auth-form" novalidate>
          <div id="signup-error" class="error-message" role="alert"></div>
          <div id="signup-success" class="success-message" role="status"></div>

          <div class="form-group">
            <label class="form-label" for="signup-fullname">Họ và tên</label>
            <input
              type="text"
              id="signup-fullname"
              name="fullname"
              class="form-input"
              placeholder="Ví dụ: Nguyễn Văn A"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-email">Địa chỉ Email</label>
            <input
              type="email"
              id="signup-email"
              name="email"
              class="form-input"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-username">Tên đăng nhập</label>
            <input
              type="text"
              id="signup-username"
              name="username"
              class="form-input"
              placeholder="Từ 6 đến 20 ký tự"
              autocomplete="username"
              minlength="6"
              maxlength="20"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-password">Mật khẩu</label>
            <div class="input-password-wrap">
              <input
                type="password"
                id="signup-password"
                name="password"
                class="form-input"
                placeholder="Tối thiểu 6 ký tự"
                autocomplete="new-password"
                minlength="6"
                required
              />
              <button
                type="button"
                class="btn-toggle-password"
                onclick="togglePasswordVisibility('signup-password', this)"
                aria-label="Hiện mật khẩu"
                title="Hiện mật khẩu"
              >
                <svg class="auth-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="auth-eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="signup-password-confirm">Xác nhận mật khẩu</label>
            <div class="input-password-wrap">
              <input
                type="password"
                id="signup-password-confirm"
                name="passwordConfirm"
                class="form-input"
                placeholder="Nhập lại mật khẩu"
                autocomplete="new-password"
                minlength="6"
                required
              />
              <button
                type="button"
                class="btn-toggle-password"
                onclick="togglePasswordVisibility('signup-password-confirm', this)"
                aria-label="Hiện mật khẩu"
                title="Hiện mật khẩu"
              >
                <svg class="auth-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="auth-eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-terms-group">
            <label class="auth-checkbox-label" for="signup-agree">
              <input type="checkbox" id="signup-agree" name="agree" required />
              <span>
                Tôi đồng ý với
                <a href="../legal/legal-center.html#terms-of-use" class="auth-inline-link">Điều khoản dịch vụ</a>
                và
                <a href="../legal/legal-center.html#privacy-policy" class="auth-inline-link">Chính sách bảo mật</a>
              </span>
            </label>
          </div>

          <button type="submit" id="signup-submit" class="auth-button">
            Tạo tài khoản PrepMate
          </button>

          <div class="auth-link">
            Đã có tài khoản?
            <a href="#" onclick="switchTab('login'); return false;">Đăng nhập tại đây</a>
          </div>
        </form>
      </section>
    </main>

    <!-- Dedicated Clean Auth Footer -->
    <footer class="auth-footer" role="contentinfo">
      <div class="auth-footer-content">
        <p class="auth-footer-copy">© 2026 PrepMate AI Inc. Tất cả quyền được bảo lưu.</p>
        <nav class="auth-footer-nav" aria-label="Liên kết pháp lý và hỗ trợ">
          <a href="../legal/legal-center.html#terms-of-use" class="auth-footer-link">Điều khoản dịch vụ</a>
          <span class="auth-footer-bullet" aria-hidden="true">•</span>
          <a href="../legal/legal-center.html#privacy-policy" class="auth-footer-link">Chính sách bảo mật</a>
          <span class="auth-footer-bullet" aria-hidden="true">•</span>
          <a href="../help/help.html" class="auth-footer-link">Trung tâm hỗ trợ</a>
        </nav>
      </div>
    </footer>

    <!-- Shared Application Scripts -->
    <script src="../../shared/js/main.js?v=18"></script>
    <script src="auth.js?v=19"></script>
    <script src="../../shared/js/components.js?v=18"></script>

    <!-- Page Specific Authentication UI Logic -->
    <script>
      // ======================================================================
      // TAB SWITCHING
      // ======================================================================
      function switchTab(tab) {
        const tabs = document.querySelectorAll("[data-tab]");
        const forms = document.querySelectorAll(".auth-form");

        tabs.forEach((tabElement) => {
          const isActive = tabElement.dataset.tab === tab;
          tabElement.classList.toggle("active", isActive);
          tabElement.setAttribute("aria-selected", String(isActive));
        });

        forms.forEach((form) => {
          form.classList.toggle("active", form.id === `${tab}-form`);
        });

        const title = document.getElementById("form-title");
        const subtitle = document.getElementById("form-subtitle");

        if (tab === "login") {
          title.textContent = "Đăng nhập";
          subtitle.textContent = "Tiếp tục hành trình luyện phỏng vấn của bạn";
        } else {
          title.textContent = "Đăng ký tài khoản";
          subtitle.textContent = "Bắt đầu luyện tập phỏng vấn cùng AI";
        }

        clearMessages();
      }

      // ======================================================================
      // PASSWORD VISIBILITY TOGGLE (ACCESSIBLE)
      // ======================================================================
      function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (!input) return;

        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";

        const eyeIcon = btn.querySelector(".auth-eye-icon");
        const eyeOffIcon = btn.querySelector(".auth-eye-off-icon");
        if (eyeIcon && eyeOffIcon) {
          eyeIcon.style.display = isPassword ? "none" : "block";
          eyeOffIcon.style.display = isPassword ? "block" : "none";
        }

        const label = isPassword ? "Ẩn mật khẩu" : "Hiện mật khẩu";
        btn.setAttribute("aria-label", label);
        btn.setAttribute("title", label);
      }

      // ======================================================================
      // MESSAGE HELPERS WITH ACCESSIBLE SVGS
      // ======================================================================
      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function showError(form, message) {
        const element = document.getElementById(`${form}-error`);
        if (!element) return;

        element.innerHTML = `
          <svg class="auth-alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span class="auth-alert-text">${escapeHtml(message)}</span>
        `;
        element.style.display = "flex";
      }

      function showSuccess(form, message) {
        const element = document.getElementById(`${form}-success`);
        if (!element) return;

        element.innerHTML = `
          <svg class="auth-alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span class="auth-alert-text">${escapeHtml(message)}</span>
        `;
        element.style.display = "flex";
      }

      function clearMessages() {
        document.querySelectorAll(".error-message, .success-message").forEach((element) => {
          element.innerHTML = "";
          element.style.display = "none";
        });
      }

      // ======================================================================
      // BUTTON STATE
      // ======================================================================
      function setButtonLoading(button, loading, normalText) {
        if (!button) return;
        button.disabled = loading;
        if (loading) {
          button.innerHTML = `
            <span class="auth-btn-spinner" aria-hidden="true"></span>
            <span>Đang xử lý...</span>
          `;
        } else {
          button.textContent = normalText;
        }
      }

      let isSubmittingAuth = false;

      // ======================================================================
      // LOGIN SUBMISSION HANDLER
      // ======================================================================
      async function handleLogin(event) {
        event.preventDefault();
        if (isSubmittingAuth) return;

        clearMessages();

        const identifier = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        const remember = document.getElementById("login-remember").checked;
        const button = document.getElementById("login-submit");

        if (!identifier || !password) {
          showError("login", "Vui lòng nhập email/username và mật khẩu.");
          return;
        }

        isSubmittingAuth = true;
        setButtonLoading(button, true, "Đăng nhập");

        try {
          const user = await loginUser(identifier, password);

          if (remember) {
            localStorage.setItem("prepmate_remember_user", "true");
          } else {
            localStorage.removeItem("prepmate_remember_user");
          }

          showSuccess(
            "login",
            `Chào mừng ${user.fullname || user.username}! Đang chuyển hướng...`
          );

          setTimeout(() => {
            redirectAfterLogin(user);
          }, 700);
        } catch (error) {
          console.error("[AUTH PAGE] Login error:", error);
          showError("login", error.message || "Đăng nhập thất bại.");
        } finally {
          isSubmittingAuth = false;
          setButtonLoading(button, false, "Đăng nhập");
        }
      }

      // ======================================================================
      // SIGNUP SUBMISSION HANDLER
      // ======================================================================
      async function handleSignup(event) {
        event.preventDefault();
        if (isSubmittingAuth) return;

        clearMessages();

        const fullname = document.getElementById("signup-fullname").value.trim();
        const email = document.getElementById("signup-email").value.trim();
        const username = document.getElementById("signup-username").value.trim();
        const password = document.getElementById("signup-password").value;
        const passwordConfirm = document.getElementById("signup-password-confirm").value;
        const agree = document.getElementById("signup-agree").checked;
        const button = document.getElementById("signup-submit");

        // Client-side validations
        if (!fullname || !email || !username || !password || !passwordConfirm) {
          showError("signup", "Vui lòng điền đầy đủ thông tin.");
          return;
        }

        if (username.length < 6 || username.length > 20) {
          showError("signup", "Tên đăng nhập phải từ 6 đến 20 ký tự.");
          return;
        }

        if (password.length < 6) {
          showError("signup", "Mật khẩu phải có ít nhất 6 ký tự.");
          return;
        }

        if (password !== passwordConfirm) {
          showError("signup", "Mật khẩu xác nhận không khớp.");
          return;
        }

        if (!agree) {
          showError("signup", "Vui lòng đồng ý với điều khoản sử dụng.");
          return;
        }

        isSubmittingAuth = true;
        setButtonLoading(button, true, "Tạo tài khoản PrepMate");

        try {
          const user = await registerUser({
            fullname,
            email,
            username,
            password,
          });

          showSuccess(
            "signup",
            `Đăng ký thành công! Chào mừng ${user.fullname || user.username}.`
          );

          setTimeout(() => {
            redirectAfterLogin(user);
          }, 700);
        } catch (error) {
          console.error("[AUTH PAGE] Register error:", error);
          showError("signup", error.message || "Đăng ký thất bại.");
        } finally {
          isSubmittingAuth = false;
          setButtonLoading(button, false, "Tạo tài khoản PrepMate");
        }
      }

      // ======================================================================
      // INFO & NAVIGATION
      // ======================================================================
      function showAuthInfo(type) {
        if (typeof showToast === "function") {
          showToast(`${type} của PrepMate.`, "info");
        } else {
          alert(`${type} của PrepMate.`);
        }
      }

      function goHome() {
        window.location.href = "../../index.html";
      }

      // ======================================================================
      // THEME INITIALIZATION (GLOBAL SYSTEM SSOT)
      // ======================================================================
      (function initAuthPageTheme() {
        const theme =
          typeof getGlobalTheme === "function"
            ? getGlobalTheme()
            : localStorage.getItem("prepmate_theme") || "light";
        if (typeof applyGlobalTheme === "function") {
          applyGlobalTheme(theme);
        } else {
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.body.classList.add("dark-mode");
            document.documentElement.classList.add("dark");
          }
        }
      })();

      // ======================================================================
      // EVENT LISTENERS
      // ======================================================================
      document.addEventListener("DOMContentLoaded", () => {
        const loginForm = document.getElementById("login-form");
        const signupForm = document.getElementById("signup-form");

        // Restore remember me preference if previously set
        const savedRemember = localStorage.getItem("prepmate_remember_user");
        const rememberCheckbox = document.getElementById("login-remember");
        if (rememberCheckbox && savedRemember === "true") {
          rememberCheckbox.checked = true;
        }

        if (loginForm) {
          loginForm.addEventListener("submit", handleLogin);
        }

        if (signupForm) {
          signupForm.addEventListener("submit", handleSignup);
        }
      });
    </script>
  </body>
</html>
