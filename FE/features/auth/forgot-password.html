<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepMate - Quên mật khẩu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Canonical Design Tokens & System Stylesheets -->
    <link rel="stylesheet" href="../../shared/css/tokens.css?v=26" />
    <link rel="stylesheet" href="../../shared/css/base.css?v=26" />
    <link rel="stylesheet" href="../../shared/css/layout.css?v=26" />
    <link rel="stylesheet" href="../../shared/css/components.css?v=26" />
    <link rel="stylesheet" href="../../shared/css/style.css?v=18" />
    <link rel="stylesheet" href="./auth.css?v=21" />

    <!-- Morphicons & Centralized PrepMate Iconography -->
    <script src="../../shared/js/morphicons.js"></script>
    <script src="../../shared/js/icons.js"></script>
  </head>

  <body class="auth-body">
    <!-- Top Navigation Bar -->
    <div class="auth-top-bar">
      <a href="../../index.html" class="auth-nav-home" title="Về trang chủ PrepMate">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Trang chủ</span>
      </a>

      <button
        type="button"
        class="auth-theme-toggle"
        id="auth-theme-toggle"
        aria-label="Chuyển đổi giao diện Sáng / Tối"
        title="Chuyển đổi giao diện Sáng / Tối"
        onclick="toggleGlobalTheme(event)"
      >
        <span class="auth-theme-icon-dark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="auth-theme-icon-light" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
      </button>
    </div>

    <!-- Main Authentication Shell -->
    <main class="auth-container">
      <section class="auth-card" aria-label="Khôi phục mật khẩu PrepMate">
        <!-- Brand Header -->
        <header class="auth-header pm-page-header">
          <a href="../../index.html" class="auth-brand-logo" aria-label="PrepMate - Về trang chủ">
            Prep<span class="auth-brand-accent">Mate</span>
          </a>
          <h1 class="auth-title pm-page-title">Quên mật khẩu?</h1>
          <p class="auth-subtitle pm-page-subtitle pm-content-wrap">Nhập email đã đăng ký để nhận liên kết đặt lại mật khẩu.</p>
        </header>

        <!-- Forgot Password Form -->
        <form id="forgot-form" class="auth-form active" novalidate>
          <div id="forgot-error" class="error-message" role="alert" style="display: none;"></div>
          <div id="forgot-success" class="success-message" role="status" style="display: none;"></div>

          <div class="form-group" id="group-email">
            <label class="form-label" for="forgot-email">Địa chỉ email</label>
            <input
              type="email"
              id="forgot-email"
              name="email"
              class="form-input"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
          </div>

          <button type="submit" id="forgot-submit" class="auth-button">
            Gửi liên kết đặt lại
          </button>

          <div class="auth-link">
            Nhớ lại mật khẩu?
            <a href="./auth.html">Quay lại Đăng nhập</a>
          </div>
        </form>
      </section>
    </main>

    <!-- Dedicated Clean Auth Footer -->
    <footer class="auth-footer" role="contentinfo">
      <div class="auth-footer-content">
        <p class="auth-footer-copy">© 2026 PrepMate AI Inc. Tất cả quyền được bảo lưu.</p>
        <nav class="auth-footer-nav" aria-label="Liên kết pháp lý và hỗ trợ">
          <a href="../legal/legal-center.html#terms-of-use" class="auth-footer-link">Điều khoản dịch vụ</a>
          <span class="auth-footer-bullet" aria-hidden="true">•</span>
          <a href="../legal/legal-center.html#privacy-policy" class="auth-footer-link">Chính sách bảo mật</a>
          <span class="auth-footer-bullet" aria-hidden="true">•</span>
          <a href="../help/help.html" class="auth-footer-link">Trung tâm hỗ trợ</a>
        </nav>
      </div>
    </footer>

    <!-- Shared Application Scripts -->
    <script src="../../shared/js/main.js?v=18"></script>
    <script src="auth.js?v=20"></script>
    <script src="../../shared/js/components.js?v=18"></script>

    <script>
      let isSubmitting = false;
      let cooldownTimer = null;
      let cooldownSeconds = 0;

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function showError(message) {
        const errEl = document.getElementById("forgot-error");
        const sucEl = document.getElementById("forgot-success");
        if (sucEl) sucEl.style.display = "none";
        if (!errEl) return;
        errEl.innerHTML = `
          <svg class="auth-alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span class="auth-alert-text">${escapeHtml(message)}</span>
        `;
        errEl.style.display = "flex";
      }

      function showSuccess(message) {
        const errEl = document.getElementById("forgot-error");
        const sucEl = document.getElementById("forgot-success");
        if (errEl) errEl.style.display = "none";
        if (!sucEl) return;
        sucEl.innerHTML = `
          <svg class="auth-alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span class="auth-alert-text">${escapeHtml(message)}</span>
        `;
        sucEl.style.display = "flex";
      }

      function formatCooldown(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }

      function startCooldown(seconds) {
        cooldownSeconds = seconds;
        const button = document.getElementById("forgot-submit");
        if (!button) return;

        clearInterval(cooldownTimer);
        button.disabled = true;
        // Immediate cooldown text set without 1s interval lag
        button.textContent = `Gửi lại sau (${cooldownSeconds}s)`;
        button.textContent = `Gửi lại sau ${formatCooldown(cooldownSeconds)}`;

        try {
          const cooldownUntil = Date.now() + seconds * 1000;
          sessionStorage.setItem("prepmate_forgot_cooldown_until", String(cooldownUntil));
        } catch (e) {}

        cooldownTimer = setInterval(() => {
          cooldownSeconds--;
          if (cooldownSeconds <= 0) {
            clearInterval(cooldownTimer);
            button.disabled = false;
            button.textContent = "Gửi liên kết đặt lại";
            try { sessionStorage.removeItem("prepmate_forgot_cooldown_until"); } catch (e) {}
          } else {
            button.textContent = `Gửi lại sau ${formatCooldown(cooldownSeconds)}`;
          }
        }, 1000);
      }

      async function handleForgot(event) {
        event.preventDefault();
        if (isSubmitting || cooldownSeconds > 0) return;

        const emailInput = document.getElementById("forgot-email");
        const email = emailInput ? emailInput.value.trim() : "";
        const button = document.getElementById("forgot-submit");

        if (!email) {
          showError("Vui lòng nhập địa chỉ email của bạn.");
          emailInput && emailInput.focus();
          return;
        }

        // Basic client validation
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError("Địa chỉ email không đúng định dạng.");
          emailInput && emailInput.focus();
          return;
        }

        isSubmitting = true;
        const originalText = button.textContent;
        button.disabled = true;
        button.textContent = "Đang gửi yêu cầu...";

        try {
          const res = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            throw new Error(data.error || "Không thể gửi yêu cầu đặt lại mật khẩu. Vui lòng thử lại.");
          }

          showSuccess("Nếu email phù hợp với tài khoản PrepMate, hướng dẫn đặt lại mật khẩu sẽ được gửi đến hộp thư của bạn.");
          startCooldown(60);
        } catch (error) {
          showError(error.message || "Đã xảy ra sự cố kết nối. Vui lòng thử lại sau.");
          button.disabled = false;
          button.textContent = originalText;
        } finally {
          isSubmitting = false;
        }
      }

      (function initTheme() {
        const theme = typeof getGlobalTheme === "function"
          ? getGlobalTheme()
          : localStorage.getItem("prepmate_theme") || "light";
        if (typeof applyGlobalTheme === "function") {
          applyGlobalTheme(theme);
        } else {
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") {
            document.body.classList.add("dark-mode");
            document.documentElement.classList.add("dark");
          }
        }
      })();

      document.addEventListener("DOMContentLoaded", () => {
        try {
          const storedUntil = sessionStorage.getItem("prepmate_forgot_cooldown_until");
          if (storedUntil) {
            const diffMs = parseInt(storedUntil, 10) - Date.now();
            if (diffMs > 0) {
              const remainingSecs = Math.ceil(diffMs / 1000);
              startCooldown(remainingSecs);
            } else {
              sessionStorage.removeItem("prepmate_forgot_cooldown_until");
            }
          }
        } catch (e) {}

        const form = document.getElementById("forgot-form");
        if (form) {
          form.addEventListener("submit", handleForgot);
        }

        const emailInput = document.getElementById("forgot-email");
        if (emailInput) {
          emailInput.addEventListener("input", () => {
            const errEl = document.getElementById("forgot-error");
            if (errEl) {
              errEl.innerHTML = "";
              errEl.style.display = "none";
            }
          });
        }
      });
    </script>
  </body>
</html>
